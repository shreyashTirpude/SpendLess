name: spendlens
description: Auto SMS-based expense tracker for Android
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Backend
  supabase_flutter: ^2.5.0

  # Navigation
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.68.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Notifications
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0

  # Ads
  google_mobile_ads: ^5.1.0

  # In-app purchase
  in_app_purchase: ^3.2.0

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Background service
  flutter_background_service: ^5.0.5

  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.4.2
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2

  # Environment
  flutter_dotenv: ^5.1.0

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  flutter_svg: ^2.0.10+1
  iconsax: ^0.0.8

  # Crash reporting
  sentry_flutter: ^8.3.0

  # HTTP
  dio: ^5.6.0

  # Lottie animations
  lottie: ^3.1.0

  # URL launcher
  url_launcher: ^6.3.0

  # Screenshot
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
